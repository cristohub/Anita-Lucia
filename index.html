<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf3e8">
  
  <!-- SEO en Google -->
  <meta name="description"
    content="Especialista en musicoterapia y expresión musical infantil. Descubre cómo potenciar el desarrollo integral, el ritmo y las emociones en la primera infancia.">
  <title>Ana Chicaiza Guapulema | Musicoterapia y Expresión Musical</title>
  
  <!-- Compartir en Redes Sociales (Facebook, WhatsApp, Discord) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://anitalucia.vercel.app/">
  <meta property="og:site_name" content="Anita Lucía — Educación Musical e Infantil">
  <meta property="og:title" content="Ana Chicaiza Guapulema | Musicoterapia y Expresión Musical">
  <meta property="og:description"
    content="Especialista en musicoterapia y expresión musical infantil. Descubre cómo potenciar el desarrollo integral, el ritmo y las emociones en la primera infancia.">
  <meta property="og:image" content="https://anitalucia.vercel.app/assets/og-image.png">
  
  <!-- Tarjeta para Twitter / X (Imagen a ancho completo) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ana Chicaiza Guapulema | Musicoterapia y Expresión Musical">
  <meta name="twitter:description"
    content="Especialista en musicoterapia y expresión musical infantil. Descubre cómo potenciar el desarrollo integral, el ritmo y las emociones en la primera infancia.">
  <meta name="twitter:image" content="https://anitalucia.vercel.app/assets/og-image.png">
  
  <!-- Enlaces de fuentes y recursos  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Favicons -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="assets/site.webmanifest">
  <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">
  </head>

<body>
  <main class="landing">
    <div class="decor decor--lavender" aria-hidden="true"></div>
    <div class="decor decor--peach" aria-hidden="true"></div>
    <div class="decor decor--gold" aria-hidden="true"></div>
    <div class="side-ring side-ring--left" aria-hidden="true"></div>
    <div class="side-ring side-ring--right" aria-hidden="true"></div>
    <div class="sun-disc" aria-hidden="true"></div>

    <header class="brand enter enter--top">
      <img class="brand__logo" src="assets/logo-header.png" alt="Anita Lucía — Educación Musical e Infantil">
    </header>

    <section class="hero" aria-labelledby="headline">
      <div class="teacher-wrap enter enter--left">
        <div class="teacher-aura" aria-hidden="true"></div>
        <div class="teacher-orbit teacher-orbit--one" aria-hidden="true"></div>
        <div class="teacher-orbit teacher-orbit--two" aria-hidden="true"></div>
        <img class="teacher" src="assets/ana.png" alt="Anita Lucía sonriendo mientras toca el acordeón">
      </div>

      <div class="message">


        <h1 id="headline" class="enter enter--delay-2"><span>PRÓXIMAMENTE</span><br>estará disponible nuestra página
          web
        </h1>
        <p class="description enter enter--delay-3">Por ahora, estamos en mantenimiento.<br class="desktop-only">
          ¡Gracias por tu paciencia y por ser parte<br class="desktop-only"> de este hermoso proyecto!</p>
        <div class="heart-mark enter enter--delay-4" aria-hidden="true">

          <svg viewBox="0 0 44 44" fill="none">
            <path d="M22 37S4 25 5 13C6 3 19 4 22 15 26 4 39 3 40 13 41 25 22 37 22 37Z" stroke="currentColor"
              stroke-width="4" stroke-linejoin="round" />
          </svg>

        </div>
      </div>

      <div class="kids-wrap enter enter--right">
        <div class="kids-aura" aria-hidden="true"></div>
        <img class="kids" src="assets/ninos.png" alt="Cinco niños ilustrados, alegres y jugando juntos">
      </div>
    </section>

    <div class="music-notes" aria-hidden="true">
      <span class="note note--1">♫</span><span class="note note--2">♪</span>
      <span class="note note--3">♫</span><span class="note note--4">♪</span>
      <span class="note note--5">♬</span><span class="note note--6">♪</span>
    </div>

    <footer class="footer enter enter--delay-4">
      <span class="footer__rule"></span>
      <span>© <span id="year"></span> Anita Lucía</span>
      <span class="footer__rule"></span>

    </footer>
  </main>
  <script src="script.js"></script>
</body>

</html>
